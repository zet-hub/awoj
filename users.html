<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="assets/js/app.js"></script>
</head>
<body class="bg parchment">
<nav class="navbar navbar-expand-lg navbar-dark bg-brown shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html">Medieval Café POS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="nav-links"></ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" id="nav-user"></span>
                <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="brand-title fs-2">User Management</div>
        <span class="badge bg-light text-dark pill" id="user-count"></span>
    </div>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow">
                <div class="card-header">Add User</div>
                <div class="card-body">
                    <form id="create-user-form">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password (plain for testing)</label>
                            <input type="text" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" name="role" id="role-select"></select>
                        </div>
                        <button class="btn btn-brown" type="submit">Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header">Users</div>
                <div class="card-body p-0">
                    <table class="table mb-0" id="users-table"></table>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="text-center text-muted py-4 small">Crafted for a medieval café — <span id="year"></span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
function renderNav(user){
    const nav=document.getElementById('nav-links');
    nav.innerHTML=[
        {href:'dashboard.html',label:'Dashboard'},
        {href:'orders.html',label:'Orders'},
        {href:'products.html',label:'Products'},
        {href:'reports.html',label:'Reports'},
        {href:'users.html',label:'Users'},
        {href:'staff_activity.html',label:'Staff'},
        {href:'settings.html',label:'Settings'},
    ].map(l=>`<li class="nav-item"><a class="nav-link" href="${l.href}">${l.label}</a></li>`).join('');
    document.getElementById('nav-user').textContent=`Logged in as ${user.name} (${user.role})`;
}
function renderRoles(roles){
    document.getElementById('role-select').innerHTML = roles.map(r=>`<option value="${r}">${r}</option>`).join('');
}
function renderUsers(users, roles){
    document.getElementById('user-count').textContent = `${users.length} users`;
    document.getElementById('users-table').innerHTML = `
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
        <tbody>
            ${users.length ? users.map(u=>`
                <tr>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>${u.created_at}</td>
                    <td class="text-end">
                        <form class="role-form d-inline" data-id="${u.id}">
                            <select name="role" class="form-select form-select-sm d-inline w-auto">
                                ${roles.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r}</option>`).join('')}
                            </select>
                            <button class="btn btn-sm btn-outline-secondary">Update</button>
                        </form>
                        <form class="reset-form d-inline ms-2" data-id="${u.id}">
                            <input type="text" name="password" class="form-control form-control-sm d-inline w-auto" placeholder="New pass" required>
                            <button class="btn btn-sm btn-outline-primary">Reset</button>
                        </form>
                    </td>
                </tr>
            `).join('') : `<tr><td colspan="5" class="text-center p-4 text-muted">No users.</td></tr>`}
        </tbody>`;
}
async function load(){
    const data = await getJSON('api/users-data.php');
    if(!data) return;
    renderNav(data.user);
    renderRoles(data.roles);
    renderUsers(data.users, data.roles);

    document.querySelectorAll('.role-form').forEach(f=>f.addEventListener('submit', async e=>{
        e.preventDefault();
        const fd=new FormData();fd.append('action','changerole');fd.append('user_id',f.dataset.id);fd.append('role',f.querySelector('select').value);
        const d=await fetch('api/users.php',{method:'POST',body:fd}).then(r=>r.json());
        if(d.redirect) location=d.redirect; else alert(d.error||'Error');
    }));
    document.querySelectorAll('.reset-form').forEach(f=>f.addEventListener('submit', async e=>{
        e.preventDefault();
        const fd=new FormData();fd.append('action','reset');fd.append('user_id',f.dataset.id);fd.append('password',f.querySelector('input').value);
        const d=await fetch('api/users.php',{method:'POST',body:fd}).then(r=>r.json());
        if(d.redirect) location=d.redirect; else alert(d.error||'Error');
    }));
}
document.getElementById('create-user-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);fd.append('action','create');
    const d=await fetch('api/users.php',{method:'POST',body:fd}).then(r=>r.json());
    if(d.redirect) location=d.redirect; else alert(d.error||'Error');
});
document.getElementById('logout-btn').addEventListener('click', async ()=>{ await getJSON('api/logout.php');});
load();
</script>
</body>
</html>

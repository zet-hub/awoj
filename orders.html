<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="assets/js/app.js"></script>
</head>
<body class="bg parchment">
<nav class="navbar navbar-expand-lg navbar-dark bg-brown shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html">Medieval Café POS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="nav-links"></ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" id="nav-user"></span>
                <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header">Menu</div>
                <div class="card-body">
                    <div class="row g-3" id="menu-items"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card shadow">
                <div class="card-header">Cart</div>
                <div class="card-body" id="cart"></div>
            </div>
            <div class="card shadow mt-3 d-none" id="receipt-card">
                <div class="card-header" id="receipt-title"></div>
                <div class="card-body" id="receipt-body"></div>
            </div>
        </div>
    </div>
    <div class="card shadow mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Recent Orders</span>
            <span class="badge bg-light text-dark pill" id="orders-count"></span>
        </div>
        <div class="card-body p-0">
            <table class="table mb-0" id="orders-table"></table>
        </div>
    </div>
</main>
<footer class="text-center text-muted py-4 small">Crafted for a medieval café — <span id="year"></span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
const navLinks = document.getElementById('nav-links');
function renderNav(user) {
    const links = [
        { href: 'dashboard.html', label: 'Dashboard' },
        { href: 'orders.html', label: 'Orders' },
    ];
    if (['admin','manager'].includes(user.role)) {
        links.push({ href: 'products.html', label: 'Products' });
        links.push({ href: 'reports.html', label: 'Reports' });
        links.push({ href: 'users.html', label: 'Users' });
        links.push({ href: 'staff_activity.html', label: 'Staff' });
    }
    links.push({ href: 'settings.html', label: 'Settings' });
    navLinks.innerHTML = links.map(l => `<li class="nav-item"><a class="nav-link" href="${l.href}">${l.label}</a></li>`).join('');
    document.getElementById('nav-user').textContent = `Logged in as ${user.name} (${user.role})`;
}

function fmt(n) { return '₱' + Number(n).toFixed(2); }

function renderMenu(items) {
    document.getElementById('menu-items').innerHTML = items.length ? items.map(item => `
        <div class="col-md-6 col-xl-4">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body">
                    <div class="fw-bold">${item.name}</div>
                    <div class="text-muted small">${item.category}</div>
                    <div class="fs-5 fw-semibold mt-2">${fmt(item.price)}</div>
                    <form class="mt-3 add-form" data-id="${item.id}">
                        <div class="input-group input-group-sm">
                            <input type="number" name="quantity" class="form-control" value="1" min="1">
                            <button class="btn btn-brown" type="submit">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    `).join('') : '<div class="text-muted">No menu items yet.</div>';
}

function renderCart(cart) {
    const container = document.getElementById('cart');
    if (!cart.items.length) {
        container.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
        return;
    }
    container.innerHTML = `
        <ul class="list-group mb-3">
            ${cart.items.map(it => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-semibold">${it.name}</div>
                        <div class="text-muted small">Qty: ${it.qty} • ${fmt(it.price)}</div>
                    </div>
                    <form class="remove-form" data-id="${it.id}">
                        <button class="btn btn-sm btn-outline-danger">Remove</button>
                    </form>
                </li>
            `).join('')}
        </ul>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="fw-bold">Total</div>
            <div class="fs-5 fw-semibold">${fmt(cart.total)}</div>
        </div>
        <form id="checkout-form">
            <input type="hidden" name="action" value="checkout">
            <div class="mb-3">
                <label class="form-label">Cash received</label>
                <input type="number" step="0.01" min="0" class="form-control" name="cash" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Payment method</label>
                <select class="form-select" name="payment_method">
                    <option value="cash">Cash</option>
                    <option value="gcash">GCash</option>
                    <option value="card">Card</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Discount (amount)</label>
                <input type="number" step="0.01" min="0" class="form-control" name="discount" value="0">
            </div>
            <div class="d-grid">
                <button class="btn btn-brown" type="submit">Checkout</button>
            </div>
        </form>
        <div class="alert alert-danger d-none" id="checkout-error"></div>
    `;
}

function renderReceipt(receipt, items) {
    const card = document.getElementById('receipt-card');
    if (!receipt) {
        card.classList.add('d-none');
        return;
    }
    card.classList.remove('d-none');
    document.getElementById('receipt-title').textContent = `Receipt #${receipt.id}`;
    const body = document.getElementById('receipt-body');
    body.innerHTML = `
        <div class="small text-muted">${receipt.created_at}</div>
        <ul class="list-group my-3">
            ${items.map(it => `<li class="list-group-item d-flex justify-content-between"><span>${it.name} x ${it.quantity}</span><span>${fmt(it.price_each * it.quantity)}</span></li>`).join('')}
        </ul>
        <div class="d-flex justify-content-between"><span>Total</span><span class="fw-semibold">${fmt(receipt.total_amount)}</span></div>
        <div class="d-flex justify-content-between"><span>Discount</span><span>${fmt(receipt.discount_amount)}</span></div>
        <div class="d-flex justify-content-between"><span>Cash</span><span>${fmt(receipt.cash_received)}</span></div>
        <div class="d-flex justify-content-between"><span>Payment</span><span class="text-uppercase">${receipt.payment_method}</span></div>
        <div class="d-flex justify-content-between"><span>Change</span><span>${fmt(receipt.change_given)}</span></div>
        <div class="small mt-2">Status: ${receipt.status}</div>
    `;
}

function renderOrders(orders, user) {
    document.getElementById('orders-count').textContent = `${orders.length} shown`;
    document.getElementById('orders-table').innerHTML = `
        <thead>
            <tr>
                <th>ID</th><th>Date</th><th>Cashier</th><th>Payment</th>
                <th class="text-end">Total</th><th class="text-end">Discount</th><th>Status</th><th></th>
            </tr>
        </thead>
        <tbody>
            ${orders.length ? orders.map(o => `
                <tr>
                    <td>${o.id}</td>
                    <td>${o.created_at}</td>
                    <td>${o.cashier}</td>
                    <td class="text-uppercase">${o.payment_method}</td>
                    <td class="text-end">${fmt(o.total_amount)}</td>
                    <td class="text-end">${fmt(o.discount_amount)}</td>
                    <td>${o.status}</td>
                    <td class="text-end">
                        ${(o.status === 'completed' && user.role === 'admin') ? `
                            <form class="void-form d-inline" data-id="${o.id}">
                                <input type="text" name="reason" class="form-control form-control-sm d-inline w-auto" placeholder="Reason">
                                <button class="btn btn-sm btn-outline-danger">Void</button>
                            </form>` : ''}
                    </td>
                </tr>
            `).join('') : `<tr><td colspan="8" class="text-center p-4 text-muted">No orders yet.</td></tr>`}
        </tbody>
    `;
}

async function load() {
    const data = await getJSON('api/orders-data.php' + window.location.search);
    if (!data) return;
    renderNav(data.user);
    renderMenu(data.menuItems);
    renderCart(data.cart);
    renderReceipt(data.receipt, data.receiptItems);
    renderOrders(data.orders, data.user);

    document.querySelectorAll('.add-form').forEach(f => f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('action', 'add_item');
        fd.append('item_id', e.target.dataset.id);
        fd.append('quantity', e.target.quantity.value);
        await fetch('api/orders.php', { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.redirect) location = d.redirect; else alert(d.error || 'Error');
        });
    }));
    document.querySelectorAll('.remove-form').forEach(f => f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('action', 'remove_item');
        fd.append('item_id', e.target.dataset.id);
        await fetch('api/orders.php', { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.redirect) location = d.redirect; else alert(d.error || 'Error');
        });
    }));
    const checkout = document.getElementById('checkout-form');
    if (checkout) {
        checkout.addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('checkout-error');
            err.classList.add('d-none');
            const fd = new FormData(checkout);
            fd.append('action', 'checkout');
            const res = await fetch('api/orders.php', { method: 'POST', body: fd });
            const d = await res.json();
            if (d.redirect) { location = d.redirect; return; }
            err.textContent = d.error || 'Error';
            err.classList.remove('d-none');
        });
    }
    document.querySelectorAll('.void-form').forEach(f => f.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!confirm('Void this transaction?')) return;
        const fd = new FormData();
        fd.append('action', 'void_transaction');
        fd.append('transaction_id', f.dataset.id);
        fd.append('reason', f.querySelector('[name=reason]').value);
        const d = await fetch('api/orders.php', { method: 'POST', body: fd }).then(r => r.json());
        if (d.redirect) location = d.redirect; else alert(d.error || 'Error');
    }));
}

document.getElementById('logout-btn').addEventListener('click', async () => {
    await getJSON('api/logout.php');
});

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="assets/js/app.js"></script>
</head>
<body class="bg parchment">
<nav class="navbar navbar-expand-lg navbar-dark bg-brown shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html">Medieval Café POS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="nav-links"></ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" id="nav-user"></span>
                <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header">Account Settings</div>
                <div class="card-body">
                    <div id="msg" class="alert d-none"></div>
                    <form id="settings-form">
                        <div class="mb-3">
                            <label class="form-label">Current password</label>
                            <input type="password" class="form-control" name="current_password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New password</label>
                            <input type="password" class="form-control" name="new_password" required>
                        </div>
                        <button class="btn btn-brown" type="submit">Update password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="text-center text-muted py-4 small">Crafted for a medieval café — <span id="year"></span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
function renderNav(user){
    const nav=document.getElementById('nav-links');
    const links=[
        {href:'dashboard.html',label:'Dashboard'},
        {href:'orders.html',label:'Orders'},
        ...( ['admin','manager'].includes(user.role) ? [
            {href:'products.html',label:'Products'},
            {href:'reports.html',label:'Reports'},
            {href:'users.html',label:'Users'},
            {href:'staff_activity.html',label:'Staff'},
        ]: []),
        {href:'settings.html',label:'Settings'},
    ];
    nav.innerHTML=links.map(l=>`<li class="nav-item"><a class="nav-link" href="${l.href}">${l.label}</a></li>`).join('');
    document.getElementById('nav-user').textContent=`Logged in as ${user.name} (${user.role})`;
}
async function bootstrapNav(){
    const data = await getJSON('api/dashboard-data.php'); // just to get user/session quickly
    if(!data) return;
    renderNav(data.user);
}
bootstrapNav();
document.getElementById('settings-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const res = await fetch('api/settings.php',{method:'POST',body:new FormData(e.target)});
    const d = await res.json();
    const msg = document.getElementById('msg');
    if(d.redirect){ location=d.redirect; return; }
    msg.textContent = d.error || d.message || 'Saved';
    msg.className = 'alert ' + (d.error ? 'alert-danger' : 'alert-success');
    msg.classList.remove('d-none');
});
document.getElementById('logout-btn').addEventListener('click', async ()=>{ await getJSON('api/logout.php');});
</script>
</body>
</html>

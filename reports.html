<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="assets/js/app.js"></script>
</head>
<body class="bg parchment">
<nav class="navbar navbar-expand-lg navbar-dark bg-brown shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html">Medieval Café POS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="nav-links"></ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" id="nav-user"></span>
                <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="brand-title fs-2 mb-3">Ledger Scrolls</div>
    <form class="row gy-2 gx-3 align-items-end mb-4" id="filter-form">
        <div class="col-md-3">
            <label class="form-label">From</label>
            <input type="date" class="form-control" name="from" id="from">
        </div>
        <div class="col-md-3">
            <label class="form-label">To</label>
            <input type="date" class="form-control" name="to" id="to">
        </div>
        <div class="col-md-2">
            <button class="btn btn-brown" type="submit">Filter</button>
        </div>
        <div class="col-md-4 text-end">
            <div class="fw-bold">Total in range: <span id="total-range"></span></div>
        </div>
    </form>
    <div class="card shadow">
        <div class="card-header">Sales</div>
        <div class="card-body p-0">
            <table class="table mb-0" id="reports-table"></table>
        </div>
    </div>
</main>
<footer class="text-center text-muted py-4 small">Crafted for a medieval café — <span id="year"></span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
function renderNav(user){
    const nav=document.getElementById('nav-links');
    nav.innerHTML = [
        {href:'dashboard.html',label:'Dashboard'},
        {href:'orders.html',label:'Orders'},
        {href:'products.html',label:'Products'},
        {href:'reports.html',label:'Reports'},
        {href:'users.html',label:'Users'},
        {href:'staff_activity.html',label:'Staff'},
        {href:'settings.html',label:'Settings'},
    ].map(l=>`<li class="nav-item"><a class="nav-link" href="${l.href}">${l.label}</a></li>`).join('');
    document.getElementById('nav-user').textContent=`Logged in as ${user.name} (${user.role})`;
}
function fmt(n){return '₱'+Number(n).toFixed(2);}
async function load(params=''){
    const data = await getJSON('api/reports-data.php'+params);
    if(!data) return;
    renderNav(data.user);
    document.getElementById('from').value = data.from;
    document.getElementById('to').value = data.to;
    document.getElementById('total-range').textContent = fmt(data.totalSales);
    document.getElementById('reports-table').innerHTML = `
        <thead><tr><th>ID</th><th>Date</th><th>Cashier</th><th class="text-end">Total</th><th class="text-end">Cash</th><th class="text-end">Change</th></tr></thead>
        <tbody>
            ${data.rows.length ? data.rows.map(r=>`
                <tr>
                    <td>${r.id}</td><td>${r.created_at}</td><td>${r.cashier}</td>
                    <td class="text-end">${fmt(r.total_amount)}</td>
                    <td class="text-end">${fmt(r.cash_received)}</td>
                    <td class="text-end">${fmt(r.change_given)}</td>
                </tr>`).join('') : `<tr><td colspan="6" class="text-center p-4 text-muted">No transactions.</td></tr>`}
        </tbody>`;
}
document.getElementById('filter-form').addEventListener('submit', e=>{
    e.preventDefault();
    const params = `?from=${encodeURIComponent(document.getElementById('from').value)}&to=${encodeURIComponent(document.getElementById('to').value)}`;
    load(params);
});
document.getElementById('logout-btn').addEventListener('click', async ()=>{ await getJSON('api/logout.php');});
load();
</script>
</body>
</html>

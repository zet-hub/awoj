<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="assets/js/app.js"></script>
</head>
<body class="bg parchment">
<nav class="navbar navbar-expand-lg navbar-dark bg-brown shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="dashboard.html">Medieval Café POS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="nav-links"></ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" id="nav-user"></span>
                <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="brand-title fs-2 mb-3">Tavern Inventory</div>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow">
                <div class="card-header">Add Category</div>
                <div class="card-body">
                    <form id="category-form">
                        <div class="mb-3">
                            <label class="form-label">Category name</label>
                            <input class="form-control" name="category_name" required>
                        </div>
                        <button class="btn btn-brown" type="submit">Save</button>
                    </form>
                </div>
            </div>
            <div class="card shadow mt-3">
                <div class="card-header">Add Menu Item</div>
                <div class="card-body">
                    <form id="create-item-form">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" min="0" class="form-control" name="price" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category_id" id="create-category" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL (optional)</label>
                            <input class="form-control" name="image_url">
                        </div>
                        <button class="btn btn-brown" type="submit">Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Menu Items</span>
                    <span class="badge bg-light text-dark pill" id="items-count"></span>
                </div>
                <div class="card-body p-0">
                    <table class="table mb-0" id="items-table"></table>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="text-center text-muted py-4 small">Crafted for a medieval café — <span id="year"></span></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
function renderNav(user) {
    const nav = document.getElementById('nav-links');
    const links = [
        { href: 'dashboard.html', label: 'Dashboard' },
        { href: 'orders.html', label: 'Orders' },
        { href: 'products.html', label: 'Products' },
        { href: 'reports.html', label: 'Reports' },
        { href: 'users.html', label: 'Users' },
        { href: 'staff_activity.html', label: 'Staff' },
        { href: 'settings.html', label: 'Settings' },
    ];
    nav.innerHTML = links.map(l => `<li class="nav-item"><a class="nav-link" href="${l.href}">${l.label}</a></li>`).join('');
    document.getElementById('nav-user').textContent = `Logged in as ${user.name} (${user.role})`;
}
function fmt(n){return '₱'+Number(n).toFixed(2);}
function renderCategories(cats){
    const sel = document.getElementById('create-category');
    sel.innerHTML = '<option value="">Choose...</option>' + cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
function renderItems(items, cats){
    document.getElementById('items-count').textContent = `${items.length} items`;
    const catOptions = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('items-table').innerHTML = `
        <thead><tr><th>Name</th><th>Category</th><th class="text-end">Price</th><th></th></tr></thead>
        <tbody>
            ${items.length ? items.map(item => `
                <tr>
                    <td class="align-middle">
                        <div class="fw-semibold">${item.name}</div>
                        ${item.image_url ? `<div class="small text-muted">${item.image_url}</div>` : ''}
                    </td>
                    <td class="align-middle">${item.category_name}</td>
                    <td class="align-middle text-end">${fmt(item.price)}</td>
                    <td class="align-middle text-end">
                        <form class="delete-form d-inline" data-id="${item.id}">
                            <button class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr class="bg-light">
                    <td colspan="4">
                        <form class="update-form row g-2 align-items-center" data-id="${item.id}">
                            <div class="col-md-4"><input class="form-control form-control-sm" name="name" value="${item.name}" required></div>
                            <div class="col-md-2"><input type="number" step="0.01" min="0" class="form-control form-control-sm" name="price" value="${item.price}" required></div>
                            <div class="col-md-3"><select class="form-select form-select-sm" name="category_id">${cats.map(c=>`<option value="${c.id}" ${c.id==item.category_id?'selected':''}>${c.name}</option>`).join('')}</select></div>
                            <div class="col-md-2"><input class="form-control form-control-sm" name="image_url" placeholder="Image URL" value="${item.image_url||''}"></div>
                            <div class="col-md-1 text-end"><button class="btn btn-sm btn-brown" type="submit">Save</button></div>
                        </form>
                    </td>
                </tr>
            `).join('') : `<tr><td colspan="4" class="text-center p-4 text-muted">No items yet.</td></tr>`}
        </tbody>`;
}
async function load(){
    const data = await getJSON('api/products-data.php');
    if(!data) return;
    renderNav(data.user);
    renderCategories(data.categories);
    renderItems(data.items, data.categories);

    document.querySelectorAll('.delete-form').forEach(f=>f.addEventListener('submit', async e=>{
        e.preventDefault();
        if(!confirm('Delete item?')) return;
        const fd=new FormData();fd.append('item_action','delete');fd.append('item_id',f.dataset.id);
        const d=await fetch('api/products.php',{method:'POST',body:fd}).then(r=>r.json());
        if(d.redirect) location=d.redirect; else alert(d.error||'Error');
    }));
    document.querySelectorAll('.update-form').forEach(f=>f.addEventListener('submit', async e=>{
        e.preventDefault();
        const fd=new FormData(f);
        fd.append('item_action','update');fd.append('item_id',f.dataset.id);
        const d=await fetch('api/products.php',{method:'POST',body:fd}).then(r=>r.json());
        if(d.redirect) location=d.redirect; else alert(d.error||'Error');
    }));
}

document.getElementById('category-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);fd.append('create_category','1');
    const d=await fetch('api/products.php',{method:'POST',body:fd}).then(r=>r.json());
    if(d.redirect) location=d.redirect; else alert(d.error||'Error');
});
document.getElementById('create-item-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);fd.append('item_action','create');
    const d=await fetch('api/products.php',{method:'POST',body:fd}).then(r=>r.json());
    if(d.redirect) location=d.redirect; else alert(d.error||'Error');
});
document.getElementById('logout-btn').addEventListener('click', async ()=>{ await getJSON('api/logout.php'); });
load();
</script>
</body>
</html>
